spring:
  data:
    redis:
      # Redis Cluster 초기 접속 노드 목록을 배포 환경변수로 주입한다. 여러 노드는 쉼표로 구분한다.
      cluster:
        nodes: ${REDIS_CLUSTER_NODES}
      lettuce:
        cluster:
          refresh:
            # Spring Boot 4.1부터 적응형 토폴로지 갱신이 기본 활성화되므로 주기만 별도로 설정한다.
            period: 30s
            dynamic-refresh-sources: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 임시 조치: RDS가 아직 빈 상태(테이블 없음)라 validate는 시작 시점에
      # "missing table" 에러로 실패한다. 별도 마이그레이션 도구(Flyway/Liquibase)를
      # 도입하기 전까지 update로 최초 스키마를 자동 생성하게 하고, 이후 실제
      # 마이그레이션 정책이 정해지면 validate로 되돌릴 것.
      # ddl-auto: validate
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

cors:
  allowed-origins:
    - https://lookddak.com

sentry:
  environment: ${SENTRY_ENVIRONMENT:production}
