spring:
  application:
    name: lookddak
  profiles:
    default: local
  jpa:
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 14d

auth:
  cookie:
    secure: true
    same-site: Lax

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
