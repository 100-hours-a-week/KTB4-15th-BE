spring:
  application:
    name: lookddak
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 14d

auth:
  cookie:
    secure: true
    same-site: Lax

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

ai:
  server:
    base-url: ${AI_SERVER_URL}
    api-key: ${AI_INTERNAL_API_KEY:}
    connect-timeout: 3s
    response-timeout: 60s
  task:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 100
    await-termination: 60s

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-url-expiration: 10m
