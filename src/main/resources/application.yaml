spring:
  application:
    name: lookddak
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 14d

auth:
  cookie:
    secure: true
    same-site: Lax

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

ai:
  server:
    base-url: ${AI_SERVER_URL}
    api-key: ${AI_INTERNAL_API_KEY:}
    connect-timeout: 3s
    response-timeout: 60s
  chat-task:
    core-pool-size: ${AI_CHAT_CORE_POOL_SIZE:2}
    max-pool-size: ${AI_CHAT_MAX_POOL_SIZE:4}
    queue-capacity: ${AI_CHAT_QUEUE_CAPACITY:20}
    await-termination: ${AI_CHAT_AWAIT_TERMINATION:60s}
  fitting-task:
    core-pool-size: ${AI_FITTING_CORE_POOL_SIZE:1}
    max-pool-size: ${AI_FITTING_MAX_POOL_SIZE:1}
    queue-capacity: ${AI_FITTING_QUEUE_CAPACITY:5}
    await-termination: ${AI_FITTING_AWAIT_TERMINATION:120s}
  task:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 100
    await-termination: 60s

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-url-expiration: 10m

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
