name: BE CD

run-name: >-
  ${{ github.event_name == 'push'
      && format('BE auto deploy - {0}', github.sha)
      || format('BE rollback - {0}', inputs.image_tag) }}

on:
  # main이 갱신되면 자동 배포 (develop→main 머지, hotfix→main 머지 모두 포함)
  push:
    branches: ["feature/cd"]
    # 문서만 바뀐 커밋으로 다운타임을 만들지 않는다.
    # CD는 필수 상태 체크가 아니므로 경로 필터를 써도 머지가 막히지 않는다.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

  # 수동 실행은 이미 ECR에 존재하는 이미지로 롤백할 때만 사용한다.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "롤백할 ECR 이미지 태그(7자리 SHA)"
        required: true
        type: string
      reason:
        description: "롤백 사유"
        required: true
        type: string

# 기본 권한을 모두 닫고 job별로 필요한 권한만 연다.
permissions: {}

# 같은 BE 레포의 배포가 겹치지 않게 한다.
# 다른 레포인 AI 배포와의 충돌은 EC2 deploy.sh의 flock이 막는다.
concurrency:
  group: lookddak-be-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: lookddak-spring
  SERVICE_KEY: be
  SSM_EXEC_TIMEOUT: "780" # EC2 배포 스크립트 실행 제한: 13분
  POLL_TIMEOUT: "900"     # GitHub의 SSM 결과 대기 제한: 15분

jobs:
  # main push일 때만 새 이미지를 빌드하고 ECR에 push한다.
  # workflow_dispatch는 기존 이미지 롤백이므로 이 job을 건너뛴다.
  build-and-push:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    environment: production
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.tag }}

    steps:
      - name: Guard - feature/cd 브랜치 확인
        if: ${{ github.ref != 'refs/heads/feature/cd' }}
        run: |
          echo "feature/cd 브랜치만 자동 배포할 수 있습니다. 현재 ref: ${GITHUB_REF}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: AWS 인증 - build role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BE_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      # Dockerfile의 builder 단계가 테스트를 실행한다는 전제다.
      # 테스트가 실패하면 이미지 push와 이후 deploy job이 실행되지 않는다.
      - name: 빌드 및 ECR push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: >-
      ${{
        always() &&
        (
          (github.event_name == 'push' && needs.build-and-push.result == 'success') ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Guard - feature/cd 브랜치 확인
        if: ${{ github.ref != 'refs/heads/feature/cd' }}
        run: |
          echo "feature/cd 브랜치의 워크플로만 운영에 배포할 수 있습니다. 현재 ref: ${GITHUB_REF}"
          exit 1

      - name: 배포 태그와 사유 확정
        id: deploy_meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_REASON: ${{ inputs.reason }}
          BUILT_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$BUILT_TAG"
            REASON="main push by ${GITHUB_ACTOR}"
          else
            TAG="$INPUT_TAG"
            REASON="$INPUT_REASON"
          fi

          if [[ ! "$TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "태그 형식이 잘못되었습니다: '$TAG' (7자리 소문자 SHA 필요)"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: AWS 인증 - deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 존재하지 않는 롤백 태그나 push 실패를 EC2 작업 전에 차단한다.
      - name: ECR 이미지 존재 확인
        env:
          TAG: ${{ steps.deploy_meta.outputs.tag }}
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" > /dev/null \
          || { echo "ECR에 ${ECR_REPOSITORY}:${TAG} 이미지가 없습니다."; exit 1; }

      - name: SSM으로 배포 요청
        id: send
        env:
          TAG: ${{ steps.deploy_meta.outputs.tag }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          PARAMS=$(jq -nc \
            --arg cmd "/opt/lookddak/scripts/deploy.sh ${SERVICE_KEY} ${TAG} ${GITHUB_RUN_ID}" \
            --arg timeout "$SSM_EXEC_TIMEOUT" \
            '{commands: [$cmd], executionTimeout: [$timeout]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "${SERVICE_KEY}-cd ${TAG} run ${GITHUB_RUN_ID}" \
            --timeout-seconds 60 \
            --parameters "$PARAMS" \
            --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=/lookddak/deploy" \
            --query "Command.CommandId" --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: 배포 결과 폴링
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ steps.deploy_meta.outputs.tag }}
          REASON: ${{ steps.deploy_meta.outputs.reason }}
        run: |
          DEADLINE=$(( $(date +%s) + POLL_TIMEOUT ))
          STATUS="Pending"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "NotYet")
            echo "$(date '+%T') status=$STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
              *) sleep 10 ;;
            esac
          done

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --output json 2>/dev/null || echo '{}')
          CODE=$(echo "$RESULT" | jq -r '.ResponseCode // "unknown"')

          echo "----- EC2 스크립트 출력(끝부분) -----"
          echo "$RESULT" | jq -r '.StandardOutputContent // ""' | tail -n 60
          echo "$RESULT" | jq -r '.StandardErrorContent // ""' | tail -n 30

          {
            echo "### BE 배포 결과"
            echo "- 이벤트: ${GITHUB_EVENT_NAME}"
            echo "- 태그: \`${TAG}\`"
            echo "- 사유: ${REASON}"
            echo "- SSM 상태: ${STATUS} / 종료 코드: ${CODE}"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$STATUS:$CODE" in
            Success:0) echo "배포 성공"; exit 0 ;;
            *:1)  echo "::error::새 버전 배포 실패 (서비스 미변경 또는 이전 버전 복구됨)"; exit 1 ;;
            *:2)  echo "::error::이전 버전 복구까지 실패! 즉시 수동 확인"; exit 1 ;;
            *:64) echo "::error::EC2 배포 설정 오류 (.env, compose, 명령 설치 상태 확인)"; exit 1 ;;
            *:75) echo "::error::다른 배포가 진행 중이라 시작하지 못함. 끝난 뒤 재실행"; exit 1 ;;
            *)    echo "::error::결과 확인 불가(status=$STATUS). CloudWatch /lookddak/deploy 확인"; exit 1 ;;
          esac